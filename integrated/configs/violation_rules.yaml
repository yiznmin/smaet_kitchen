# M6 違規判定(單人)規則設定 —— 由 run_violations.py 讀取
#
# 鏡頭名稱與區域是示範廚房的配置;換場地要改 cameras、zones,並重畫 configs/zones/ 的區域。
# 洗手秒數、緩衝時間、碰觸類別等規範參數可依企業的食安規範調整。
# 相對路徑一律相對於本資料夾。

step_s: 0.1                    # 偵測快取每步秒數(30 fps、每 3 幀一步)

cameras:
  overview: output0            # 俯視全景:定位人站在哪一側、洗手台、垃圾桶
  close:                       # 近拍鏡頭,依人站的位置挑一組
    A: [Aoutput1, Aoutput2, Aoutput3]
    B: [Boutput1, Boutput2]
  side_x: {x_a: 480.9, x_b: 729.3}   # output0 腳點 x 座標的 A / B 側分界

zones:
  output0: configs/zones/epfl_output0.json      # 垃圾桶區、洗手台
  Aoutput1: configs/zones/epfl_Aoutput1.json    # 垃圾桶區、洗手台_NG4
  Aoutput2: configs/zones/epfl_Aoutput2.json    # 洗手台_NG4
  Boutput1: configs/zones/epfl_Boutput1.json    # 洗手台(上方近拍)
  Boutput2: configs/zones/epfl_Boutput2.json    # 洗手台(上方近拍)

# 人—物關聯(判斷手碰到食材 / 器具)
association:
  thr_person: 0.3
  hand_in_person: 0.5
  thr_hand: 0.3
  thr_obj: 0.4
  d: 0.1                       # 手與物件框間距 ≤ d × 人框高
  iou_move: 0.9                # 0.5 秒前後物件框 IoU < 此值 = 在動
  lag: 5                       # 動態比較間隔(步)
  win: [5, 3]                  # 遲滯平滑:最近 5 步有 3 步成立才開
  k_off: 10                    # 連續 10 步不成立才關
  role_k: 2                    # 近拍組至少 2 台成立

touch_classes: [食材, 刀具, 砧板, 鍋鏟, 鍋子, 容器]   # 「碰到食材 / 器具」的類別

# 碰垃圾桶:Aoutput1 看到手在垃圾桶區,且 output0 看到人站在垃圾桶前
trash_event:
  hand_cam: Aoutput1
  body_cam: output0
  zone: 垃圾桶區
  thr_hand: 0.2
  body_ioa: 0.2
  sync_s: 0.5                  # 兩台鏡頭前後此秒數內都看到
  smooth: [3, 2, 5]
  min_s: 1.0                   # 持續 ≥ 此秒數才算碰到
  backtrack: {enable: false, near_s: 1.0, gap_s: 1.0, max_s: 10.0}   # 手拿著要丟的東西時起點往前推(關閉)

# 洗手
hand_hygiene:
  wash_cam: output0
  sink_zone: 洗手台
  wash_mode: close_hand        # close_hand = 上方近拍鏡頭看到手在水槽;hand = output0 手中心在洗手台;
                               # body = output0 人框蓋住洗手台;close_hand_body = close_hand 且 body(±sync_s)
  close_cams: [Boutput1, Boutput2]
  sync_s: 0.5
  thr_hand: 0.2
  body_ioa: 0.2
  wash_s: 1.0                  # 洗手累計 ≥ 此秒數才算洗過手
  grace_s: 1.0                 # 離開垃圾桶後此秒數才開始算「髒手」

# NG1 碰垃圾桶後沒洗手 / NG2 髒手碰食材、器具、容器(兩者是獨立事件)
ng:
  merge_s: 5.0                 # NG1:兩次接觸垃圾桶間隔 < 此秒數合併成一次
  ng1_wash_within_s: 5.0       # NG1:最後一次接觸結束後此秒數內要洗手
  touch_gap_s: 1.0             # NG2:碰觸間隔 < 此秒數合併成同一次
  touch_min_s: 0.3             # NG2:碰觸至少持續此秒數才算一次
  ignore_wash_s: 0.0           # 碰觸前後此秒數內有洗手 → 視為洗手中不算(0 = 關閉)

# NG4 洗過的食材 / 器具直接放桌面
# 位置看不出來也輸出 NG4,status = 待確認;放桌面 = 確定;放砧板 / 容器 / 鍋子 = 合格,不輸出。
ng4:
  enable: true
  objects: [食材, 刀具, 砧板, 鍋鏟, 鍋子, 容器]
  views: [Aoutput1, Aoutput2, Aoutput3, Boutput1, Boutput2]
  sink_cams: [Boutput1, Boutput2, Aoutput1, Aoutput2]   # 有洗手台_NG4 範圍的鏡頭(排除水槽內還在洗的東西)
  wash_views: [Boutput1, Boutput2]   # 判斷清洗用的鏡頭
  sink_zone: 洗手台_NG4
  wash_smooth: false           # 水槽內物件框斷續,不平滑、直接累計
  wash_min_s: 0.3              # 清洗累計 ≥ 此秒數才算洗過
  wash_gap_s: 1.0              # 清洗中斷 < 此秒數算同一次
  put_min_s: 0.3               # 停留 ≥ 此秒數才算放下
  judge_offset_s: 0.5          # 放下後此秒數開始判斷位置
  decide: majority             # 位置以多數鏡頭為準
  max_gap_s: 30.0              # 洗完後此秒數內還沒放下就不管
  during_wash: true            # 清洗期間就開始找放下(連洗好幾樣時,先放下的也會判)
  lock_support: true           # 已放到砧板 / 容器上的,之後在上面被移動不再算新的放下
  start_s: 2.0                 # 清洗開始後此秒數內在水槽外看到的東西,當成原本就在
  start_mode: base
  sup_mem_s: 5.0               # 砧板 / 容器被手、刀擋住時,沿用前此秒數看到的位置
  supports: [砧板, 容器, 鍋子]   # 放在這些上面算合格
  release_s: 2.0               # 放下前此秒數內手要碰過該位置(沒被動過的東西不算放下)
  sup_only_s: 0.1              # 有看到在砧板 / 容器 / 鍋子上、且沒有任何桌面證據 → 合格
  sup_dedup_iou: 0.5           # 和食材框重疊(IoU ≥ 此值)的支撐物框視為同一個東西,不算支撐物

# NG3 手碰臉:手碰到臉就觸發,每碰一次算一次
# 不算:摸頭髮、隔著衛生紙擦鼻子、用湯匙等餐具吃東西。需要人體姿態(run_violations.py 給 --video-dir)。
ng3:
  enable: true
  views: [output0, Aoutput1]   # 看得到臉的鏡頭
  r: 0.5                       # 手框到臉中心 ≤ r × 肩寬 = 手在臉旁
  kp_thr: 0.3                  # 姿態關鍵點分數門檻
  thr_hand: 0.2                # 手框信心門檻
  min_s: 0.2                   # 連續 ≥ 此秒數才算一次碰臉
  merge_s: 2.0                 # 兩次碰臉間隔 < 此秒數合併
  pose_every: 2                # 姿態每 2 步(0.2 秒)估一幀
  gap_fill_s: 0.2              # 長度 ≤ 此秒數的中斷視為連續
  fusion: veto2                # 任一台成立即成立;但另一台看清楚兩隻手且都離臉 > veto_r × 肩寬則否決
  veto_r: 1.0
  clear_conf: 0.4              # 看清楚 = 看到臉、手框 ≥ 2 且第二高信心 ≥ 此值
  wrist_r: 1.0                 # 手框到手腕關鍵點 ≤ 此值 × 肩寬才算手(排除牆面 / 地板誤偵)
  short_r: 0.4                 # 碰臉不到 0.3 秒時,最短距離須 ≤ 此值 × 肩寬(排除手快速經過臉旁)
