# M6 違規判定(單人)規則設定 —— 由 src/m6_events/violation.py 使用
#
# 目前的值是 EPFL 廚房的初版(docs/M6_違規判定_單人_預先登記_20261021.md);
# 洗手秒數、緩衝、碰觸類別等「規範參數」要等食安負責人填規範表(docs/違規事件_資料準備說明_20261021.md §2)後再改。
# 相對路徑一律相對於 integrated/。

step_s: 0.1                    # 偵測快取每步秒數(30 fps、stride 3)

cameras:
  overview: output0            # 定位 A / B 側、洗手台、垃圾桶(身體)
  close:                       # 近拍鏡頭,依站的位置挑一組(角色分工融合)
    A: [Aoutput1, Aoutput2, Aoutput3]
    B: [Boutput1, Boutput2]
  side_x: {x_a: 480.9, x_b: 729.3}   # output0 腳點 x 分界(YH2040 校準)

zones:
  output0: configs/zones/epfl_output0.json      # 垃圾桶區、洗手台
  Aoutput1: configs/zones/epfl_Aoutput1.json    # 垃圾桶區
  Boutput1: configs/zones/epfl_Boutput1.json    # 洗手台(上方近拍)
  Boutput2: configs/zones/epfl_Boutput2.json    # 洗手台(上方近拍)

# 人—物關聯(M6 V 規則;HY3 凍結值)
association:
  thr_person: 0.3
  hand_in_person: 0.5
  thr_hand: 0.3
  thr_obj: 0.4
  d: 0.1                       # 手與物件框間距 ≤ d × 人框高
  iou_move: 0.9                # 0.5 秒前後物件框 IoU < 此值 = 在動
  lag: 5                       # 動態比較間隔(步)
  win: [5, 3]                  # 遲滯平滑:最近 5 步有 3 步成立才開
  k_off: 10                    # 連續 10 步不成立才關
  role_k: 2                    # 近拍組至少 2 台成立

touch_classes: [食材, 刀具, 砧板, 鍋鏟, 鍋子, 容器]   # 「碰到食材 / 器具」的類別

# 觸發:垃圾桶事件(事件測試第 3 輪 trash_body 凍結設定)
trash_event:
  hand_cam: Aoutput1
  body_cam: output0
  zone: 垃圾桶區
  thr_hand: 0.2
  body_ioa: 0.2
  sync_s: 0.5
  smooth: [3, 2, 5]
  min_s: 1.0
  # 回推污染起點(§8.22 / §8.23):手拿著要丟的食材 → 起點往前推;§8.23 未達採用條件,維持關閉
  backtrack: {enable: false, near_s: 1.0, gap_s: 1.0, max_s: 10.0}

# 洗手規則
hand_hygiene:
  wash_cam: output0
  sink_zone: 洗手台
  wash_mode: close_hand        # 第 2 輪最佳(docs/M6_違規判定_單人_預先登記_20261021.md §8.3);hand = output0 手中心在洗手台;body = output0 人框蓋住洗手台;
                               # close_hand = 上方近拍鏡頭手在水槽;close_hand_body = close_hand 且 body(±sync_s)
  close_cams: [Boutput1, Boutput2]
  sync_s: 0.5
  thr_hand: 0.2
  body_ioa: 0.2
  wash_s: 1.0                  # 髒手期間洗手累計秒數(第 2 輪最佳;待規範表)
  grace_s: 1.0                 # 觸發後幾秒才開始算「髒手」(待規範表)

# 團隊 NG 準則(src/m6_events/ng.py;docs/M6_NG準則評估_預先登記_20261027.md §8.8–8.11)
ng:
  merge_s: 5.0                 # NG1:兩次接觸污染源間隔 < 此秒數合併成一次
  ng1_wash_within_s: 5.0       # NG1:最後一次接觸結束後此秒數內要洗手(團隊定義)
  touch_gap_s: 1.0             # NG2:碰觸間隔 < 此秒數合併成同一次
  touch_min_s: 0.3             # NG2:碰觸至少持續此秒數才算一次
  ignore_wash_s: 0.0           # 碰觸前後此秒數內有洗手 → 視為洗手中不算(§8.11 未達門檻,預設關閉)

# 團隊 NG4a:洗過的食材 / 廚具直接放桌面(src/m6_events/ng4.py;docs/M6_NG準則評估_預先登記_20261027.md §8.36–8.39)
# 適用條件:M3 抓得到水槽內的物件(評估集 = 食材可偵測的人工檢視片段)。
# 2026-11-04 使用者選擇偏召回(回查用、寧可多報):清洗期間也找放下(§8.42 / 8.44 格點,R 0.83 / P 0.52);
# 原設定(洗完才找,R 0.63 / P 0.65)= 把 during_wash 改成 false。
# 位置「無法判斷」也輸出 NG4,status = 待確認;「桌面」= 確定;放砧板 / 容器不輸出。
ng4:
  enable: true
  objects: [食材, 刀具, 砧板, 鍋鏟, 鍋子, 容器]
  views: [Aoutput1, Aoutput2, Aoutput3, Boutput1, Boutput2]
  sink_cams: [Boutput1, Boutput2]
  wash_smooth: false           # 水槽內物件框斷續,不平滑、直接累計
  wash_min_s: 0.3
  wash_gap_s: 1.0
  put_min_s: 0.3
  judge_offset_s: 0.5
  decide: majority
  max_gap_s: 30.0
  during_wash: true            # 清洗期間也找放下(連續洗好幾樣食材時,先放下的也會判)
  lock_support: true           # 已放到砧板 / 容器上的食材,之後在上面被移動不再算新的放下
  # §8.54 / 8.55:使用者選用(R 0.74 / P 0.62,原設定 R 0.83 / P 0.52);三行都拿掉 = 回到 §8.46
  start_s: 2.0                 # 清洗開始後 2 秒內在水槽外看到的框當成原本就在(食材剛拿進水槽時還在移動)
  start_mode: base
  sup_mem_s: 5.0               # 砧板 / 容器被手、刀擋住時,沿用前 5 秒看到的位置
  supports: [砧板, 容器, 鍋子]   # §8.60:放進鍋子裡也算放進容器(LOPO R 0.76 / P 0.67)
