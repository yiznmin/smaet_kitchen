# 智慧廚房 M1~M5 人員追蹤管線設定檔(由 run_pipeline.py 讀取)
#
# 主體區塊 = profile delivery;檔尾 profiles 列出其他組合與主體的差異,用 --profile 切換。
# 相對路徑一律相對於本資料夾。

profile: delivery            # delivery | single_person(見檔尾 profiles)

# ── M1 影像擷取 ───────────────────────────────────────────────────────
# 目前只支援讀影片檔(src/common/video_io.py),不支援 RTSP 串流。
m1:
  sources: {}                # camera_id: 影片路徑;也可改用命令列 --videos / --cameras
  stride: 5                  # 每 5 幀取 1 幀(30 fps 影片 = 6 fps)
  fps: 30.0                  # 影片幀率,用來把迴圈數換成秒
  max_loops: -1              # 最多處理幾個迴圈(1 迴圈 = stride 幀);-1 = 跑到影片結束
  start_fid: 0               # 起始影片幀(含),必須是 stride 的倍數
  end_fid: -1                # 結束影片幀(含);-1 = 到影片結束

# ── M2 動態偵測 ───────────────────────────────────────────────────────
m2:
  branch_a:                  # 分支 A:全域 frame-diff
    enabled: true
    diff_threshold: 25       # absdiff 後二值化門檻
    min_motion_ratio: 0.002  # 變動像素佔比超過此值判定有動態
    blur_ksize: 5            # 前處理高斯模糊核
    use_reference_frame: false   # false = 與前一張取樣幀比
    # gate_m3 = true 時,無動態的幀不跑 M3,沿用該鏡頭上一次的偵測結果(省運算,預設關閉)。
    gate_m3: false
    gate_max_hold_loops: 30  # 閘門開啟時,最多連續沿用幾個迴圈就強制重跑一次 M3
  dynamic_line:              # 分支 B 動態線:MOG2 找移動小目標(例如老鼠)
    enabled: false           # 每幀每鏡頭都要跑 MOG2,預設關閉
    min_blob_area: 8
    large_blob_area: 2000
    exclusion_margin: 24
    density_radius: 120
    density_max_neighbors: 3
    crop_size: 256
    max_crops_per_frame: 32
    mog2_history: 500
    mog2_var_threshold: 16
    warmup_frames: 30
    persistence_frames: 3
    match_max_dist: 60
    track_max_miss: 2
  static_line:               # 分支 B 靜態線:慢速基準比對找靜止新增物(例如水漬)
    enabled: false
    baseline_alpha: 0.002
    baseline_diff_thresh: 30
    motion_thresh: 25
    blur_ksize: 5
    min_blob_area: 60
    max_blob_area: 120000
    crop_size: 256
    warmup_frames: 30
    motion_exclusion_margin: 61
    max_aspect_ratio: 2.0
    persistence_frames: 8
    match_max_dist: 40
    track_max_miss: 3
    density_radius: 120
    density_max_neighbors: 4
    freeze_confirmed: true
    # 地板 ROI:多鏡頭時用 floor_zone_by_camera 逐台給多邊形;都沒給 = 全畫面。
    floor_zone_file: null
    floor_zone_name: 地板
    floor_zone: null
    floor_zone_by_camera: {}   # camera_id: [[x, y], ...]
  classifier:                # 分支 B 的確認分類器;沒有權重檔時候選一律標「待確認」
    onnx: weights/branch_b_classifier.onnx   # 未提供
    input_size: 224
    target_index: 1
    threshold: 0.5

# ── M3 物件偵測(RF-DETR)────────────────────────────────────────────
m3:
  variant: nano              # nano | small | medium
  # weights = null:COCO 預訓權重,只偵測人(人的 class_id = 1)。
  # 廚房 11 類:weights/m3_nano_r2_armA/checkpoint_best_total.pth(人的 class_id = 0)。
  weights: null
  # 推論解析度。auto = 微調權重用訓練解析度(704),COCO 預訓用變體預設(nano 384);
  # 也可填整數(須為 32 的倍數)或 null(一律用變體預設)。
  resolution: auto
  thr: 0.10                  # 送進 M4 的「人」的信心門檻(低分框供追蹤器第二輪關聯)
  person_cls: null           # null = 依有無 weights 自動判斷(COCO = 1、微調 = 0)
  det_cache: null            # 偵測快取目錄(內含 <camera_id>.npz);給了就不載入 RF-DETR
  # 微調 11 類的逐類門檻,只在有 weights 時生效,用於 detections.csv;送進 M4 的人一律用上面的 thr。
  # 換權重、換變體或換解析度後,用 scripts/sweep_thresholds.py 重掃。
  class_thresholds:
    人: 0.3
    刀具: 0.3
    砧板: 0.2
    食材: 0.25
    鍋鏟: 0.65
    鍋子: 0.35
    手: 0.1
    容器: 0.65
    抹布: 0.3
    夾子: 0.3      # 訓練資料沒有此類樣本,模型實際上無法偵測
    手套: 0.3      # 同上
# ── M4 單鏡頭追蹤 ─────────────────────────────────────────────────────
m4:
  backend: rf_cbiou          # C-BIoU(Roboflow trackers 套件)
  track_activation_threshold: 0.25
  minimum_matching_threshold: 0.8
  lost_track_buffer: 30      # 單位是更新次數;stride 5 @ 30 fps 時 = 5 秒
  frame_rate: 30
  minimum_consecutive_frames: 1
  history_len: 30
  backend_params:            # 只會讀與 backend 同名的那一段
    rf_cbiou:
      buffer_ratio_first: 0.3
      buffer_ratio_second: 0.5
    rf_mcbyte_nomask_app:    # single_person 用:外觀特徵進關聯成本
      appearance_w: 0.7
      embedder: dinov2
      ema_momentum: 0.9

# ── M5 跨鏡頭身份 ─────────────────────────────────────────────────────
m5:
  embedder: none             # none | color | dinov2
  ttl_loops: 600             # 離場後保留幾個迴圈;stride 5 @ 30 fps 時 = 100 秒
  topology_file: null        # 外部拓撲檔(格式同下方 camera_topology 區塊);給了就忽略下方區塊

# 相機拓撲:各鏡頭之間的移動時間與畫面重疊關係。這一份是示範場地(7 台)的設定,換場地必須重建。
camera_topology:
  fusion:
    mode: llr
    background_arrival_hz: 0.04820     # 新身份出現率(每秒)
    cost_false_merge_over_break: 5.0   # 綁定門檻 = ln(5.0) = 1.6094 nats
    transit_model: loiter
    p_loiter: 0.1798
    tau_loiter_s: 8.51
    appearance_profile: dinov2
    appearance_clip: null
    overlap_llr: 5.0
    overlap_window_s: 0.5
    same_camera: { enabled: true, tau_break_s: 2.0, max_gap_s: 15.0 }
    unknown_path: { enabled: true, median_multiplier: 2.0, log_sigma: 0.8, logprior: -2.0 }
    direction: { enabled: false }
  links:                     # 鏡頭間移動時間(秒,平均與標準差)
    - { from: camera_2, to: camera_6, mean_s: 3.261, std_s: 1.845 }
    - { from: camera_6, to: camera_7, mean_s: 0.617, std_s: 0.481 }
    - { from: camera_7, to: camera_5, mean_s: 10.542, std_s: 4.278 }
  overlapping:               # 畫面有重疊的鏡頭組
    - [camera_2, camera_3]
    - [camera_2, camera_4]
    - [camera_2, camera_5]
    - [camera_3, camera_4]
    - [camera_3, camera_5]
    - [camera_4, camera_5]
    - [camera_5, camera_6]
  clock:
    max_skew_s: 0.2
  cameras:
    camera_1: { clock_offset_s: 0.0 }
    camera_2: { clock_offset_s: 0.0 }
    camera_3: { clock_offset_s: 0.0 }
    camera_4: { clock_offset_s: 0.0 }
    camera_5: { clock_offset_s: 0.0 }
    camera_6: { clock_offset_s: 0.0 }
    camera_7: { clock_offset_s: 0.0 }

# ── 輸出 ──────────────────────────────────────────────────────────────
output:
  dir: outputs/run
  resident_every: 50         # 每幾個迴圈取樣一次常駐狀態與記憶體
  save_frames: false         # 存跨鏡頭標註幀(同一 chef_id 各鏡頭同色)到 <dir>/frames
  save_frames_every: 0       # 每 N 迴圈存一張;0 = 只在開新 chef_id 時存

# ── 設定組合 ──────────────────────────────────────────────────────────
# 每個組合只寫與主體不同的鍵;dict 逐層合併,list 整段取代。
profiles:
  # 多人場景用:C-BIoU 追蹤,M5 不用外觀特徵。
  delivery: {}

  # 單人場景用(畫面裡只有一個人時):M4 加入 DINOv2 外觀關聯、M5 用 DINOv2 外觀。不可用於多人場景。
  single_person:
    m4:
      backend: rf_mcbyte_nomask_app
    m5:
      embedder: dinov2
    camera_topology:
      overlapping:
        - [camera_1, camera_2]
        - [camera_1, camera_3]
        - [camera_1, camera_5]
        - [camera_6, camera_7]
        - [camera_2, camera_3]
        - [camera_2, camera_4]
        - [camera_2, camera_5]
        - [camera_3, camera_4]
        - [camera_3, camera_5]
        - [camera_4, camera_5]
        - [camera_5, camera_6]
