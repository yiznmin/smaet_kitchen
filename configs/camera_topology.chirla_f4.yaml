# CHIRLA 拓撲 + F4 跨鏡頭單應性(chirla_build_crossview.py 產生)
#
# ⚠ 單應性**只從推導集 seq_000/seq_001/seq_002 估**,評估集完全沒有參與。
#   腳本硬性拒絕推導集以外的序列,見 DERIVATION 常數。
# ⚠ σ 用**留出樣本**估(30%),不是擬合殘差 —— 後者會系統性低估,
#   使 LLR 過度自信而把真正的同一人判成位置對不上。
# ⚠ σ 是 pairwise 殘差,**不可再乘 √2**(已含兩台鏡頭的誤差)。
